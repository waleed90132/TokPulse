name: Trends Auto Updater 🚀

on:
  schedule:
    # التشغيل التلقائي كل ساعة على رأس الساعة (01:00, 02:00, 03:00 ...)
    - cron: '0 * * * *'
  # زر يدوي لتشغيل التحديث بأي لحظة بدك إياها من واجهة Actions في GitHub
  workflow_dispatch:

# إعطاء صلاحيات الكتابة للـ Bot عشان يرفع data.json بدون مشاكل أذونات
permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Trend Generator Script
        run: |
          python trend_generator.py

      - name: Commit and Push Updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "تحديث تلقائي للترندات كل ساعة 🚀 [skip ci]"
          git pull --rebase origin main
          git push origin main
