name: Trends Auto Updater 🚀

on:
  schedule:
    # التشغيل تلقائياً كل ساعة على رأس الساعة (01:00, 02:00, 03:00 ...)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Trend Generator Script
      run: python trend_generator.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git diff --staged --quiet || git commit -m "تحديث تلقائي للترندات كل ساعة 🚀"
        git pull --rebase origin main
        git push origin main
